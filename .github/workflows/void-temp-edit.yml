name: Void temporary edit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  edit:
    if: github.event.head_commit.message != 'chore: apply void temporary edit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant code
        run: |
          echo '--- App markers ---'
          grep -nE 'claude-chat|sendClaudeMessage|isDedicatedFiles|MediaFileRecord|media-update|media-create' src/react-app/App.tsx | head -80 || true
          echo '--- Claude CSS markers ---'
          grep -nE 'claude-|ai-' src/react-app/App.css | head -80 || true
